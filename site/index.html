<title>JARVIS</title>

<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #05080d;
        color: #ffffff;
    }

    body {
        min-height: 100vh;
    }

    .jarvis-home {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(
                circle at center,
                rgba(0, 150, 255, 0.08),
                transparent 45%
            ),
            #05080d;
    }

    .jarvis-header {
        height: 80px;
        padding: 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
    }

    .jarvis-logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 5px;
    }

    .login-button {
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        transition: 0.2s;
    }

    .login-button:hover {
        background: rgba(255, 255, 255, 0.08);
    }

    .jarvis-main {
        flex: 1;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 70px 25px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    .jarvis-greeting {
        text-align: center;
        width: 100%;
        transition:
            opacity 0.45s ease,
            transform 0.45s ease,
            max-height 0.45s ease,
            margin 0.45s ease;
        max-height: 500px;
        overflow: hidden;
    }

    .core {
        width: 110px;
        height: 110px;
        margin: 0 auto 35px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .core-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid rgba(0, 170, 255, 0.45);
        border-radius: 50%;
        animation: pulse 3s infinite;
    }

    .core-ring::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(0, 170, 255, 0.3);
        border-radius: 50%;
    }

    .core-center {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #0b8cff;
        box-shadow:
            0 0 20px rgba(0, 140, 255, 0.8),
            0 0 50px rgba(0, 140, 255, 0.35);
    }

    @keyframes pulse {
        0% {
            transform: scale(0.95);
            opacity: 0.6;
        }

        50% {
            transform: scale(1.05);
            opacity: 1;
        }

        100% {
            transform: scale(0.95);
            opacity: 0.6;
        }
    }

    .jarvis-label {
        font-size: 12px;
        letter-spacing: 4px;
        color: #5faeff;
    }

    .jarvis-greeting h1 {
        margin: 18px 0 10px;
        font-size: clamp(30px, 5vw, 48px);
        font-weight: 500;
    }

    .jarvis-greeting p {
        margin: 0;
        color: rgba(255, 255, 255, 0.55);
        font-size: 16px;
    }

    .jarvis-chat {
        width: 100%;
        max-width: 850px;
        margin-top: 55px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        transition: margin 0.45s ease;
    }

    .chat-messages {
        width: 100%;
        flex: 1;
        min-height: 80px;
        max-height: 420px;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scroll-behavior: smooth;
    }

    .chat-message {
        max-width: 80%;
        padding: 13px 17px;
        border-radius: 14px;
        line-height: 1.5;
        word-wrap: break-word;
        animation: messageIn 0.3s ease;
    }

    @keyframes messageIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chat-message.user {
        align-self: flex-end;
        background: #0b8cff;
        color: #ffffff;
        border-bottom-right-radius: 4px;
    }

    .chat-message.jarvis {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        border-bottom-left-radius: 4px;
    }

    .chat-input-container {
        width: 100%;
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 20px;
        margin-top: 15px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.25);
        transition:
            box-shadow 0.3s ease,
            border-color 0.3s ease;
    }

    .chat-input-container:focus-within {
        border-color: rgba(11, 140, 255, 0.5);
        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.25),
            0 0 25px rgba(11, 140, 255, 0.08);
    }

    #chatInput {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: #ffffff;
        font-size: 16px;
    }

    #chatInput::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }

    .mic-button,
    .send-button {
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 20px;
        transition: 0.2s;
    }

    .mic-button {
        background: rgba(255, 255, 255, 0.07);
        color: #ffffff;
    }

    .mic-button:hover {
        background: rgba(255, 255, 255, 0.14);
    }

    .mic-button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .send-button {
        background: #0b8cff;
        color: #ffffff;
    }

    .send-button:hover {
        background: #2b9cff;
        transform: scale(1.03);
    }

    .chat-status {
        text-align: center;
        margin-top: 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
    }

    .jarvis-footer {
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.3);
        font-size: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        flex-shrink: 0;
    }

    /*
     * MODO CONVERSA
     */

    .jarvis-home.chat-mode .jarvis-main {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .jarvis-home.chat-mode .jarvis-greeting {
        opacity: 0;
        transform: translateY(-25px);
        max-height: 0;
        margin: 0;
    }

    .jarvis-home.chat-mode .jarvis-chat {
        margin-top: 0;
        max-width: 850px;
    }

    .jarvis-home.chat-mode .chat-messages {
        max-height: none;
    }

    .jarvis-home.chat-mode .chat-input-container {
        margin-top: 15px;
    }

    /*
     * MOBILE
     */

    @media (max-width: 600px) {
        .jarvis-header {
            height: 65px;
            padding: 0 20px;
        }

        .jarvis-logo {
            font-size: 18px;
        }

        .jarvis-main {
            padding: 45px 15px 25px;
        }

        .jarvis-greeting h1 {
            font-size: 30px;
        }

        .jarvis-chat {
            margin-top: 40px;
        }

        .chat-message {
            max-width: 90%;
        }

        .jarvis-footer {
            padding: 15px 20px;
        }

        .jarvis-home.chat-mode .jarvis-main {
            padding: 15px 10px 10px;
        }

        .jarvis-home.chat-mode .jarvis-footer {
            display: none;
        }

        .jarvis-home.chat-mode .chat-input-container {
            border-radius: 16px;
        }
    }
</style>

```
<div class="jarvis-home" id="jarvisHome">

    <header class="jarvis-header">

        <div class="jarvis-logo">
            JARVIS
        </div>

        <a
            href="pages/login.html"
            class="login-button"
        >
            Entrar
        </a>

    </header>

    <main class="jarvis-main">

        <section class="jarvis-greeting">

            <div class="core">
                <div class="core-ring"></div>
                <div class="core-center"></div>
            </div>

            <span class="jarvis-label">
                JARVIS CORE
            </span>

            <h1>
                Como vai seu dia hoje?
            </h1>

            <p>
                Digite um comando ou use o microfone.
            </p>

        </section>

        <section class="jarvis-chat">

            <div
                id="chatMessages"
                class="chat-messages"
            >
            </div>

            <form
                id="chatForm"
                class="chat-input-container"
            >

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Digite um comando..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="micButton"
                    class="mic-button"
                    aria-label="Usar microfone"
                    title="Usar microfone"
                >
                    🎙
                </button>

                <button
                    type="submit"
                    class="send-button"
                    aria-label="Enviar"
                    title="Enviar"
                >
                    ➤
                </button>

            </form>

            <div
                id="chatStatus"
                class="chat-status"
            >
                JARVIS pronto.
            </div>

        </section>

    </main>

    <footer class="jarvis-footer">

        <span>
            JARVIS
        </span>

        <span>
            Sistema inteligente
        </span>

    </footer>

</div>

<script>

    const jarvisHome =
        document.getElementById("jarvisHome");

    const chatForm =
        document.getElementById("chatForm");

    const chatInput =
        document.getElementById("chatInput");

    const chatMessages =
        document.getElementById("chatMessages");

    const chatStatus =
        document.getElementById("chatStatus");

    const micButton =
        document.getElementById("micButton");

    let conversationStarted = false;


    function activateChatMode() {

        if (conversationStarted) {
            return;
        }

        conversationStarted = true;

        jarvisHome.classList.add(
            "chat-mode"
        );

    }


    function addMessage(text, sender) {

        activateChatMode();

        const message =
            document.createElement("div");

        message.classList.add(
            "chat-message",
            sender
        );

        message.textContent = text;

        chatMessages.appendChild(
            message
        );

        requestAnimationFrame(
            function() {
                chatMessages.scrollTop =
                    chatMessages.scrollHeight;
            }
        );
    }


    chatForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                chatInput.value.trim();

            if (!message) {
                return;
            }

            addMessage(
                message,
                "user"
            );

            chatInput.value = "";

            chatStatus.textContent =
                "JARVIS processando...";

            try {

                const response =
                    await sendMessage(message);

                addMessage(
                    response,
                    "jarvis"
                );

                chatStatus.textContent =
                    "JARVIS pronto.";

            } catch (error) {

                console.error(
                    "Erro JARVIS:",
                    error
                );

                addMessage(
                    "Não consegui processar seu comando. Verifique a conexão com o núcleo JARVIS.",
                    "jarvis"
                );

                chatStatus.textContent =
                    "Falha na comunicação.";
            }

        }
    );


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (SpeechRecognition) {

        const recognition =
            new SpeechRecognition();

        recognition.lang =
            "pt-BR";

        recognition.interimResults =
            false;

        recognition.continuous =
            false;


        micButton.addEventListener(
            "click",
            function() {

                try {

                    recognition.start();

                    micButton.textContent =
                        "🔴";

                    chatStatus.textContent =
                        "JARVIS está ouvindo...";

                } catch (error) {

                    console.log(error);

                }

            }
        );


        recognition.addEventListener(
            "result",
            function(event) {

                const transcript =
                    event
                        .results[0][0]
                        .transcript;

                chatInput.value =
                    transcript;

                chatStatus.textContent =
                    "Comando reconhecido.";

                chatInput.focus();

            }
        );


        recognition.addEventListener(
            "end",
            function() {

                micButton.textContent =
                    "🎙";

                if (
                    chatStatus.textContent ===
                    "JARVIS está ouvindo..."
                ) {

                    chatStatus.textContent =
                        "JARVIS pronto.";

                }

            }
        );


        recognition.addEventListener(
            "error",
            function(error) {

                console.error(
                    "Microfone:",
                    error
                );

                micButton.textContent =
                    "🎙";

                chatStatus.textContent =
                    "Não foi possível utilizar o microfone.";

            }
        );

    } else {

        micButton.disabled = true;

        micButton.title =
            "Seu navegador não suporta reconhecimento de voz.";

    }


    setTimeout(
        function() {

            if (!conversationStarted) {

                addMessage(
                    "Olá. Eu sou o JARVIS. Como posso ajudar você hoje?",
                    "jarvis"
                );

            }

        },
        600
    );


    chatInput.focus();

</script>
