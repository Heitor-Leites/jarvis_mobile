<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css?v=2">

    <script src="js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div class="jarvis-home" id="jarvisHome">

    <header class="jarvis-header">
        <div class="jarvis-logo">JARVIS</div>

        <a href="pages/login.html" class="login-button">
            Entrar
        </a>
    </header>

    <main class="jarvis-main">

        <section class="jarvis-greeting">
            <div class="core">
                <div class="core-ring"></div>
                <div class="core-center"></div>
            </div>

            <span class="jarvis-label">JARVIS CORE</span>

            <h1>Como vai seu dia hoje?</h1>

            <p>Digite um comando ou use o microfone.</p>
        </section>

        <section class="jarvis-chat">

            <div id="chatMessages" class="chat-messages"></div>

            <form id="chatForm" class="chat-input-container">

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Digite um comando..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="micButton"
                    class="mic-button"
                    aria-label="Usar microfone"
                    title="Usar microfone"
                >
                    🎙️
                </button>

                <button
                    type="submit"
                    class="send-button"
                    aria-label="Enviar"
                    title="Enviar"
                >
                    ➤
                </button>

            </form>

            <div id="chatStatus" class="chat-status">
                JARVIS pronto.
            </div>

        </section>

    </main>

    <footer class="jarvis-footer">
        <span>JARVIS</span>
        <span>Sistema inteligente</span>
    </footer>

</div>

<script>
const jarvisHome = document.getElementById("jarvisHome");
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const chatMessages = document.getElementById("chatMessages");
const chatStatus = document.getElementById("chatStatus");
const micButton = document.getElementById("micButton");

let conversationStarted = false;

/* ==========================================
   STATUS
========================================== */

function setChatStatus(text, state = "ready") {
    chatStatus.textContent = text;
    chatStatus.dataset.state = state;
}

/* ==========================================
   MODO CONVERSA
========================================== */

function activateChatMode() {
    if (conversationStarted) return;

    conversationStarted = true;
    jarvisHome.classList.add("chat-mode");
}

/* ==========================================
   DIGITAÇÃO DO JARVIS
========================================== */

async function typeMessage(element, text, speed = 12) {

    let current = "";

    for (let i = 0; i < text.length; i++) {
        current += text.charAt(i);

        element.innerHTML = marked.parse(current, { breaks: true });

        chatMessages.scrollTop = chatMessages.scrollHeight;

        await new Promise(resolve => setTimeout(resolve, speed));
    }
}

/* ==========================================
   ADICIONAR MENSAGEM
========================================== */

async function addMessage(text, sender) {

    const message = document.createElement("div");
    message.classList.add("chat-message", sender);

    chatMessages.appendChild(message);

    if (sender === "jarvis") {
        await typeMessage(message, text);
    } else {
        message.innerHTML = marked.parse(text, { breaks: true });
    }

    requestAnimationFrame(() => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });
}

/* ==========================================
   ENVIO DA MENSAGEM
========================================== */

chatForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const message = chatInput.value.trim();
    if (!message) return;

    // O Core desaparece somente agora.
    activateChatMode();

    await addMessage(message, "user");

    chatInput.value = "";
    chatInput.disabled = true;
    micButton.disabled = true;

    // Sem barra de processamento.
    setChatStatus("JARVIS pensando...", "ready");

    try {

        const response = await sendMessage(message);

        await addMessage(response, "jarvis");

        setChatStatus("JARVIS pronto.", "ready");

    } catch (error) {

        console.error("Erro JARVIS:", error);

        await addMessage(
            "Não consegui processar seu comando. Verifique a conexão com o núcleo JARVIS.",
            "jarvis"
        );

        setChatStatus("Falha na comunicação.", "error");

    } finally {

        chatInput.disabled = false;
        micButton.disabled = false;
        chatInput.focus();
    }

});

/* ==========================================
   MICROFONE
========================================== */

const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition = new SpeechRecognition();

    recognition.lang = "pt-BR";
    recognition.interimResults = false;
    recognition.continuous = false;

    micButton.addEventListener("click", function () {

        try {

            recognition.start();

            micButton.textContent = "🔴";
            micButton.classList.add("listening");

            setChatStatus("JARVIS está ouvindo...", "listening");

        } catch (e) {
            console.log(e);
        }

    });

    recognition.addEventListener("result", function (event) {

        const transcript = event.results[0][0].transcript;

        chatInput.value = transcript;
        chatInput.focus();

        setChatStatus("Comando reconhecido.", "ready");

    });

    recognition.addEventListener("end", function () {

        micButton.textContent = "🎙️";
        micButton.classList.remove("listening");

        if (chatStatus.dataset.state === "listening") {
            setChatStatus("JARVIS pronto.", "ready");
        }

    });

    recognition.addEventListener("error", function (error) {

        console.error("Microfone:", error);

        micButton.textContent = "🎙️";
        micButton.classList.remove("listening");

        setChatStatus(
            "Não foi possível utilizar o microfone.",
            "error"
        );

    });

} else {

    micButton.disabled = true;
    micButton.title =
        "Seu navegador não suporta reconhecimento de voz.";

}

/* ==========================================
   BOAS-VINDAS AUTOMÁTICAS
========================================== */

setTimeout(async function () {

    if (!conversationStarted) {

        await addMessage(
            "Olá. Eu sou o JARVIS. Como posso ajudar você hoje?",
            "jarvis"
        );

    }

}, 600);

/* ==========================================
   INICIALIZAÇÃO
========================================== */

setChatStatus("JARVIS pronto.", "ready");
chatInput.focus();

</script>

</body>
</html>
