</div>

<script>

/* ==========================================
   ELEMENTOS
========================================== */

const jarvisHome = document.getElementById("jarvisHome");
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const chatMessages = document.getElementById("chatMessages");
const chatStatus = document.getElementById("chatStatus");
const micButton = document.getElementById("micButton");
const authButton = document.getElementById("authButton");

let conversationStarted = false;


/* ==========================================
   PERFIL / AUTENTICAÇÃO
========================================== */

async function loadUserProfile() {

    const token = localStorage.getItem("jarvis_token");

    if (!token) {
        return;
    }

    try {

        const user = await apiRequest(
            "/me",
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (
            user &&
            user.picture_url
        ) {

            authButton.href = "pages/profile.html";
            authButton.classList.add("jarvis-profile");
            authButton.innerHTML = "";

            const image = document.createElement("img");

            image.src = user.picture_url;
            image.alt = "Perfil";

            image.onerror = function () {

                authButton.classList.remove("jarvis-profile");
                authButton.href = "pages/login.html";
                authButton.textContent = "Entrar";

            };

            authButton.appendChild(image);

        }

    } catch (error) {

        console.error(
            "Erro ao carregar perfil:",
            error
        );

        if (error.status === 401) {

            localStorage.removeItem(
                "jarvis_token"
            );

            authButton.href =
                "pages/login.html";

            authButton.classList.remove(
                "jarvis-profile"
            );

            authButton.textContent =
                "Entrar";
        }
    }
}


/* ==========================================
   STATUS
========================================== */

function setChatStatus(text, state = "ready") {

    chatStatus.textContent = text;
    chatStatus.dataset.state = state;

}


/* ==========================================
   MODO CONVERSA
========================================== */

function activateChatMode() {

    if (conversationStarted) return;

    conversationStarted = true;

    jarvisHome.classList.add(
        "chat-mode"
    );

}


/* ==========================================
   DIGITAÇÃO DO JARVIS
========================================== */

async function typeMessage(
    element,
    text,
    speed = 12
) {

    let current = "";

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        current += text.charAt(i);

        element.innerHTML =
            marked.parse(
                current,
                {
                    breaks: true
                }
            );

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    speed
                )
        );

    }

}


/* ==========================================
   ADICIONAR MENSAGEM
========================================== */

async function addMessage(
    text,
    sender
) {

    const message =
        document.createElement("div");

    message.classList.add(
        "chat-message",
        sender
    );

    chatMessages.appendChild(
        message
    );

    if (sender === "jarvis") {

        await typeMessage(
            message,
            text
        );

    } else {

        message.innerHTML =
            marked.parse(
                text,
                {
                    breaks: true
                }
            );

    }

    requestAnimationFrame(
        () => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }
    );

}


/* ==========================================
   ENVIO DA MENSAGEM
========================================== */

chatForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const message =
            chatInput.value.trim();

        if (!message) return;

        activateChatMode();

        await addMessage(
            message,
            "user"
        );

        chatInput.value = "";

        chatInput.disabled = true;
        micButton.disabled = true;

        setChatStatus(
            "JARVIS pensando...",
            "ready"
        );

        try {

            const response =
                await sendMessage(
                    message
                );

            await addMessage(
                response,
                "jarvis"
            );

            setChatStatus(
                "JARVIS pronto.",
                "ready"
            );

        } catch (error) {

            console.error(
                "Erro JARVIS:",
                error
            );

            await addMessage(
                "Não consegui processar seu comando. Verifique a conexão com o núcleo JARVIS.",
                "jarvis"
            );

            setChatStatus(
                "Falha na comunicação.",
                "error"
            );

        } finally {

            chatInput.disabled = false;
            micButton.disabled = false;

            chatInput.focus();

        }

    }
);


/* ==========================================
   MICROFONE
========================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "pt-BR";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;

    micButton.addEventListener(
        "click",
        function () {

            try {

                recognition.start();

                micButton.textContent =
                    "🔴";

                micButton.classList.add(
                    "listening"
                );

                setChatStatus(
                    "JARVIS está ouvindo...",
                    "listening"
                );

            } catch (e) {

                console.log(e);

            }

        }
    );

    recognition.addEventListener(
        "result",
        function (event) {

            const transcript =
                event.results[0][0]
                    .transcript;

            chatInput.value =
                transcript;

            chatInput.focus();

            setChatStatus(
                "Comando reconhecido.",
                "ready"
            );

        }
    );

    recognition.addEventListener(
        "end",
        function () {

            micButton.textContent =
                "🎙️";

            micButton.classList.remove(
                "listening"
            );

            if (
                chatStatus.dataset.state ===
                "listening"
            ) {

                setChatStatus(
                    "JARVIS pronto.",
                    "ready"
                );

            }

        }
    );

    recognition.addEventListener(
        "error",
        function (error) {

            console.error(
                "Microfone:",
                error
            );

            micButton.textContent =
                "🎙️";

            micButton.classList.remove(
                "listening"
            );

            setChatStatus(
                "Não foi possível utilizar o microfone.",
                "error"
            );

        }
    );

} else {

    micButton.disabled = true;

    micButton.title =
        "Seu navegador não suporta reconhecimento de voz.";

}


/* ==========================================
   BOAS-VINDAS AUTOMÁTICAS
========================================== */

setTimeout(
    async function () {

        if (!conversationStarted) {

            await addMessage(
                "Olá. Eu sou o JARVIS. Como posso ajudar você hoje?",
                "jarvis"
            );

        }

    },
    600
);


/* ==========================================
   INICIALIZAÇÃO
========================================== */

setChatStatus(
    "JARVIS pronto.",
    "ready"
);

loadUserProfile();

chatInput.focus();

</script>

</body>
