<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">J.A.R.V.I.S. Reactor Core</title>
  <desc id="desc">Reator circular geométrico azul do J.A.R.V.I.S.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="76%">
      <stop offset="0" stop-color="#12334f"/>
      <stop offset=".58" stop-color="#071725"/>
      <stop offset="1" stop-color="#02060c"/>
    </radialGradient>
    <radialGradient id="core" cx="34%" cy="25%" r="80%">
