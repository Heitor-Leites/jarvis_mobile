<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Enviar comentário | J.A.R.V.I.S.</title>
    <link rel="stylesheet" href="../css/legal.css?v=2">
</head>
<body>
    <main class="legal-page">
        <a class="legal-back" href="../index.html">← Voltar ao J.A.R.V.I.S.</a>
        <article class="legal-card">
            <h1>Enviar comentário</h1>
            <p>Conte como foi sua experiência. Você pode enviar um elogio, comentário, sugestão ou reclamação.</p>

            <form class="feedback-form" id="feedbackForm">
                <label>
                    Tipo de mensagem
                    <select name="category" required>
                        <option value="elogio">Elogio</option>
                        <option value="comentario" selected>Comentário</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="reclamacao">Reclamação</option>
                    </select>
                </label>

                <label>
                    Nome <span>(opcional)</span>
                    <input type="text" name="name" maxlength="160" autocomplete="name">
                </label>

                <label>
                    E-mail <span>(opcional)</span>
                    <input type="email" name="email" maxlength="320" autocomplete="email">
                </label>

                <label>
                    Mensagem
                    <textarea name="message" maxlength="4000" required placeholder="Escreva sua mensagem..."></textarea>
                </label>

                <button class="feedback-submit" type="submit">Enviar mensagem</button>
                <p class="feedback-status" id="feedbackStatus" role="status" aria-live="polite"></p>
            </form>
        </article>
    </main>

    <script>
        const feedbackForm = document.getElementById("feedbackForm");
        const feedbackStatus = document.getElementById("feedbackStatus");

        feedbackForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = feedbackForm.querySelector("button[type=submit]");
            const formData = new FormData(feedbackForm);
            const payload = Object.fromEntries(formData.entries());

            button.disabled = true;
            feedbackStatus.className = "feedback-status";
            feedbackStatus.textContent = "Enviando...";

            try {
                const response = await fetch("https://api.30jarvis.com.br/feedback", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.detail || "Não foi possível enviar sua mensagem.");
                }

                feedbackForm.reset();
                feedbackStatus.className = "feedback-status success";
                feedbackStatus.textContent = "Mensagem enviada. Obrigado por ajudar a melhorar o J.A.R.V.I.S.!";
            } catch (error) {
                feedbackStatus.className = "feedback-status error";
                feedbackStatus.textContent = error.message || "Não foi possível enviar sua mensagem.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
