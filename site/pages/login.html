<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS | Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                JARVIS
            </div>

            <p class="login-subtitle">
                Sistema de inteligência artificial
            </p>

            <form id="login-form">

                <div class="input-group">

                    <label for="username">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit" id="login-button">
                    Entrar
                </button>

            </form>

            <div class="login-status" id="login-status">
                Acesso seguro
            </div>

        </div>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>

        const form = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const button = document.getElementById("login-button");
        const status = document.getElementById("login-status");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;


            if (!username || !password) {

                status.textContent = "Preencha usuário e senha.";

                return;
            }


            button.disabled = true;
            button.textContent = "Entrando...";
            status.textContent = "Autenticando...";


            try {

                const data = await apiRequest("/login", {

                    method: "POST",

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });


                saveToken(data.access_token);


                status.textContent = "Login realizado com sucesso.";

                button.textContent = "Acesso autorizado";


                setTimeout(function () {

                    window.location.href = "../index.html";

                }, 500);


            } catch (error) {

                status.textContent = error.message;

                button.disabled = false;
                button.textContent = "Entrar";

            }

        });

    </script>

</body>
</html>
