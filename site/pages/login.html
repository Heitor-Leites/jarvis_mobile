
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JARVIS | Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<main class="login-page">

    <div class="login-card">

        <div class="login-logo">
            JARVIS
        </div>

        <p class="login-subtitle">
            Sistema de inteligência artificial
        </p>

        <!-- LOGIN TRADICIONAL -->

        <form id="login-form">

            <div class="input-group">

                <label for="username">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="login-button"
            >
                Entrar
            </button>

        </form>

        <!-- DIVISOR -->

        <div class="login-divider">
            <span>ou</span>
        </div>

        <!-- GOOGLE -->

        <button
            type="button"
            id="google-login-button"
            class="google-login-button"
        >
            Entrar com Google
        </button>

        <div
            class="login-status"
            id="login-status"
        >
            Acesso seguro
        </div>

    </div>

</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>

<script>

/* ============================================================
   ELEMENTOS
   ============================================================ */

const form =
    document.getElementById("login-form");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const button =
    document.getElementById("login-button");

const googleButton =
    document.getElementById("google-login-button");

const status =
    document.getElementById("login-status");


/* ============================================================
   STATUS
   ============================================================ */

function statusMessage(message) {

    if (status) {
        status.textContent = message;
    }

}


/* ============================================================
   VERIFICAR SESSÃO EXISTENTE
   ============================================================ */

async function checkExistingSession() {

    const token = getToken();

    if (!token) {
        return;
    }

    statusMessage(
        "Verificando sessão..."
    );

    form.style.display = "none";
    googleButton.style.display = "none";

    try {

        await apiRequest(
            "/me",
            {
                method: "GET",
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        statusMessage(
            "Sessão ativa. Entrando..."
        );

        window.location.replace(
            "dashboard.html"
        );

    }

    catch (error) {

        console.error(
            "Erro ao verificar sessão:",
            error
        );

        removeToken();

        form.style.display = "";
        googleButton.style.display = "";

        statusMessage(
            "Acesso seguro"
        );

    }

}


/* ============================================================
   GOOGLE OAUTH
   ============================================================ */

const hashParams =
    new URLSearchParams(
        window.location.hash.substring(1)
    );

const oauthToken =
    hashParams.get("token");

const oauthError =
    hashParams.get("oauth_error");


/* ============================================================
   GOOGLE OAUTH CALLBACK
   ============================================================ */

if (oauthToken) {

    saveToken(oauthToken);

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

    statusMessage(
        "Login com Google realizado com sucesso."
    );

    setTimeout(
        function () {

            window.location.replace(
                "dashboard.html"
            );

        },
        300
    );

}

else if (oauthError) {

    statusMessage(
        "Não foi possível entrar com o Google."
    );

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

}


/* ============================================================
   LOGIN NORMAL
   ============================================================ */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;

        if (!username || !password) {

            statusMessage(
                "Preencha usuário e senha."
            );

            return;

        }

        button.disabled = true;
        googleButton.disabled = true;

        button.textContent =
            "Entrando...";

        statusMessage(
            "Autenticando..."
        );

        try {

            const data =
                await apiRequest(
                    "/login",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

            if (!data.access_token) {

                throw new Error(
                    "Token de acesso não recebido."
                );

            }

            saveToken(
                data.access_token
            );

            statusMessage(
                "Login realizado com sucesso."
            );

            button.textContent =
                "Acesso autorizado";

            setTimeout(
                function () {

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                350
            );

        }

        catch (error) {

            console.error(
                "Erro no login:",
                error
            );

            statusMessage(
                error.message ||
                "Não foi possível realizar o login."
            );

            button.disabled = false;
            googleButton.disabled = false;

            button.textContent =
                "Entrar";

        }

    }
);


/* ============================================================
   LOGIN COM GOOGLE
   ============================================================ */

googleButton.addEventListener(
    "click",
    function () {

        googleButton.disabled = true;
        button.disabled = true;

        googleButton.textContent =
            "Conectando ao Google...";

        statusMessage(
            "Redirecionando para o Google..."
        );

        window.location.href =
            "https://api.30jarvis.com.br/auth/google/login";

    }
);


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

if (!oauthToken && !oauthError) {

    checkExistingSession();

}

</script>

</body>

</html>
